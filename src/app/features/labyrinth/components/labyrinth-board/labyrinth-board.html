<div class="bg-white rounded-lg shadow-md p-6">
  <h3 class="text-xl font-semibold mb-4 text-gray-800">Labyrinthe</h3>

  <div *ngIf="cells().length; else noData" class="space-y-3">
    <div *ngFor="let cell of cells()" class="flex items-center justify-between p-3 rounded-md border" [ngClass]="{
           'bg-gray-200 border-gray-300': cell.value === 'wall',
           'bg-green-100 border-green-300': cell.value === 'path',
           'bg-red-100 border-red-300': cell.value === 'trap',
           'bg-blue-100 border-blue-300': cell.value === 'home',
           'bg-yellow-100 border-yellow-300': cell.value === 'stop'
         }">

      <div>
        <span class="font-medium capitalize">{{ cell.value }}</span>
        <span class="text-gray-600 ml-2">({{ cell.x }}, {{ cell.y }})</span>
      </div>

      <button *ngIf="cell.move" (click)="moveTo(cell)"
        class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1 rounded text-sm transition-colors">
        Se déplacer
      </button>
    </div>
  </div>

  <ng-template #noData>
    <div class="text-center py-8 text-gray-500">
      <p>Aucune donnée disponible</p>
      <p class="text-sm mt-2">Démarrez le jeu et découvrez les cases</p>
    </div>
  </ng-template>
</div>
