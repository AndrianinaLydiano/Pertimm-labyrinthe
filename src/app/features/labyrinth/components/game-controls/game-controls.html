<div class="bg-white rounded-lg shadow-md p-6">
  <h2 class="text-xl font-semibold mb-4 text-gray-800">Contrôles</h2>

  <div class="space-y-4">
    <div>
      <label for="playerName" class="block text-sm font-medium text-gray-700 mb-2">
        Nom du joueur
      </label>
      <input
        id="playerName"
        type="text"
        [(ngModel)]="playerName"
        (input)="onNameInput()"
        placeholder="Entrez votre nom"
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        [class.border-red-500]="nameError"
        [class.border-gray-300]="!nameError"
      />

      <!-- Message d'erreur -->
      <p *ngIf="nameError" class="text-red-500 text-sm mt-1">
        {{ nameError }}
      </p>
    </div>
    <button (click)="startGame()"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-colors">
      Démarrer le jeu
    </button>

    <button (click)="discover()"
      class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-md transition-colors">
      Découvrir les voisins
    </button>

    <button (click)="solveAutomatically()"
      class="w-full font-medium py-2 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed bg-purple-500 hover:bg-purple-600 text-white">
      <span>Résoudre automatiquement</span>
    </button>
  </div>
</div>
